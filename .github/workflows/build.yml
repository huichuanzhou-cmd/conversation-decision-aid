name: Build Conversation Decision Aid v0.3.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build Windows application
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ConversationDecisionAid-v0.3.1-Windows-x64
          path: dist/ConversationDecisionAid-v0.3.1-Windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build macOS DMG
        run: bash scripts/build-unix.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: ConversationDecisionAid-v0.3.1-macOS
          path: dist/ConversationDecisionAid-v0.3.1-macOS.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install DEB packaging prerequisite
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Test and build Linux DEB
        run: bash scripts/build-unix.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: ConversationDecisionAid-v0.3.1-Linux
          path: dist/ConversationDecisionAid-v0.3.1-Linux.deb
          if-no-files-found: error
