help.about=Este projeto experimental de hobby calcula apenas a partir dos valores inseridos. Ele não entende descrições escritas, não verifica suposições, não prevê comportamento, não fornece um diagnóstico psicológico ou escolhe por você. Sua fórmula não foi validada cientificamente.
help.formula=Para cada fator habilitado, subtraia o efeito prejudicial estimado do efeito benéfico e multiplique pela importância desse fator. Neutro contribui com zero.
help.formula_percent=Cada valor do controle deslizante é dividido por 100 para cálculo. A pontuação de uma opção é 100 vezes a soma de suas contribuições fatoriais.
help.benefit_harm=Benefício significa uma mudança favorável neste fator; dano, uma mudança desfavorável. Por exemplo, no nível de estresse, menos estresse é um benefício e mais estresse é um dano.
