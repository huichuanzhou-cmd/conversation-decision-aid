help.about=Dieses experimentelle Hobbyprojekt rechnet nur aus den von Ihnen eingegebenen Werten. Es versteht keine schriftlichen Beschreibungen, überprüft keine Annahmen, sagt kein Verhalten voraus, stellt keine psychologische Diagnose und wählt nicht für Sie aus. Seine Formel ist nicht wissenschaftlich validiert.
help.formula=Subtrahieren Sie für jeden aktivierten Faktor den geschätzten Schadenseffekt vom Nutzeneffekt und multiplizieren Sie ihn dann mit der Bedeutung dieses Faktors. Neutral trägt null bei.
help.formula_percent=Zur Berechnung wird jeder Schiebereglerwert durch 100 geteilt. Der Wert einer Option beträgt das Hundertfache der Summe ihrer Faktorbeiträge.
help.benefit_harm=Nutzen bedeutet eine günstige Veränderung dieses Faktors, Schaden eine ungünstige. Beim Stressniveau ist zum Beispiel weniger Stress ein Nutzen und mehr Stress ein Schaden.
