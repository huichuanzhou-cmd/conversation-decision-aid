tooltip.impact=Hiệu quả tổng thể nếu nó xảy ra. Hãy xem xét sức mạnh và thời gian.
tooltip.neutral=Khả năng còn lại không mang lại lợi ích cũng như tác hại đáng kể.
help.about=Dự án sở thích thử nghiệm này chỉ tính toán từ các giá trị bạn nhập. Nó không hiểu các mô tả bằng văn bản, xác minh các giả định, dự đoán hành vi, đưa ra chẩn đoán tâm lý hoặc lựa chọn thay bạn. Công thức của nó chưa được xác nhận một cách khoa học.
help.formula=Đối với mỗi yếu tố được kích hoạt, hãy trừ tác động có hại ước tính khỏi tác động có lợi, sau đó nhân với tầm quan trọng của yếu tố đó. Trung lập đóng góp bằng không.
help.formula_percent=Mỗi giá trị thanh trượt được chia cho 100 để tính toán. Điểm của một lựa chọn là 100 lần tổng số đóng góp của yếu tố đó.
help.benefit_harm=Lợi ích là thay đổi theo hướng có lợi của yếu tố này; tác hại là thay đổi theo hướng bất lợi. Ví dụ, với mức độ căng thẳng, giảm căng thẳng là lợi ích và tăng căng thẳng là tác hại.
