help.shared_importance=Tầm quan trọng được chia sẻ giữa các tùy chọn cho cùng một hệ số đặt trước. Ước tính lợi ích và tác hại cũng như liệu yếu tố này có được bật hay không vẫn tùy thuộc vào tùy chọn.
help.overlap=Tránh chọn nhiều yếu tố về cơ bản mô tả cùng một hậu quả; các yếu tố chồng chéo có thể được tính nhiều lần.
