tooltip.importance=How much this factor matters to you. Shared across all options.
tooltip.probability=How likely this effect is to happen.
tooltip.impact=Overall effect if it happens. Consider strength and duration.
tooltip.neutral=Remaining chance of neither a significant benefit nor harm.
help.about=This experimental hobby project only calculates from the values you enter. It does not understand written descriptions, verify assumptions, predict behavior, provide a psychological diagnosis, or choose for you. Its formula has not been scientifically validated.
help.formula=For each enabled factor, subtract the estimated harm effect from the benefit effect, then multiply by that factor's importance. Neutral contributes zero.
help.formula_percent=Each slider value is divided by 100 for calculation. An option's score is 100 times the sum of its factor contributions.
help.benefit_harm=Benefit means a favorable change in this factor; Harm means an unfavorable change. For example, for Stress level, less stress is a benefit and more stress is a harm.
