help.shared_importance=Важность распределяется между опциями для одного и того же предустановленного фактора. Оценки пользы и вреда, а также вопрос о том, включен ли этот фактор, остаются в зависимости от варианта.
help.overlap=Избегайте выбора нескольких факторов, которые описывают по существу одно и то же последствие; перекрывающиеся факторы могут учитываться более одного раза.
