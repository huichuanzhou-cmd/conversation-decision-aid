help.about=Этот экспериментальный хобби-проект рассчитывается только на основе введенных вами значений. Он не понимает письменных описаний, не проверяет предположения, не прогнозирует поведение, не ставит психологический диагноз и не выбирает за вас. Его формула не подтверждена научно.
help.formula=Для каждого включенного фактора вычтите предполагаемый вред из эффекта пользы, а затем умножьте на важность этого фактора. Нейтральный вклад равен нулю.
help.formula_percent=Для расчета каждое значение ползунка делится на 100. Оценка опциона в 100 раз превышает сумму его факторных вкладов.
help.benefit_harm=Польза означает благоприятное изменение этого фактора, вред — неблагоприятное. Например, для уровня стресса снижение стресса — польза, а повышение — вред.
