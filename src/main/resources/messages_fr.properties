help.about=Ce projet de passe-temps expérimental calcule uniquement à partir des valeurs que vous entrez. Il ne comprend pas les descriptions écrites, ne vérifie pas les hypothèses, ne prédit pas le comportement, ne fournit pas de diagnostic psychologique ou ne choisit pas à votre place. Sa formule n'a pas été validée scientifiquement.
help.formula=Pour chaque facteur activé, soustrayez l’effet dommageable estimé de l’effet bénéfice, puis multipliez par l’importance de ce facteur. Le neutre contribue à zéro.
help.formula_percent=Chaque valeur du curseur est divisée par 100 pour le calcul. Le score d'une option est 100 fois la somme de ses contributions factorielles.
help.benefit_harm=Un bénéfice est un changement favorable de ce facteur, un préjudice un changement défavorable. Par exemple, pour le niveau de stress, moins de stress est un bénéfice et davantage de stress un préjudice.
