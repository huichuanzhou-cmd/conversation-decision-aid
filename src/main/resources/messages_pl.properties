help.shared_importance=Ważność jest dzielona pomiędzy opcjami dla tego samego ustawionego współczynnika. Szacunki korzyści i szkód oraz to, czy czynnik jest włączony, zależą od opcji.
help.overlap=Unikaj wybierania kilku czynników, które opisują zasadniczo te same konsekwencje; nakładające się czynniki mogą policzyć to więcej niż raz.
