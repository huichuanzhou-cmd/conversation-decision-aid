help.about=Ten eksperymentalny projekt hobbystyczny oblicza wyłącznie na podstawie wprowadzonych wartości. Nie rozumie pisemnych opisów, nie weryfikuje założeń, nie przewiduje zachowań, nie stawia diagnozy psychologicznej, nie wybiera za Ciebie. Jego formuła nie została potwierdzona naukowo.
help.formula=Dla każdego włączonego czynnika odejmij szacowany efekt szkody od efektu korzyści, a następnie pomnóż przez wagę tego czynnika. Neutralny wnosi zero.
help.formula_percent=Każda wartość suwaka jest dzielona przez 100 w celu obliczeń. Wynik opcji jest 100-krotnością sumy jej wkładów.
help.benefit_harm=Korzyść oznacza korzystną zmianę tego czynnika, a szkoda — niekorzystną. Na przykład w przypadku poziomu stresu mniej stresu to korzyść, a więcej stresu to szkoda.
