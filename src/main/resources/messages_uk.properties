help.about=Цей експериментальний хобі-проект обчислює лише значення, які ви вводите. Він не розуміє письмових описів, перевірки припущень, прогнозування поведінки, психологічного діагнозу чи вибору за вас. Його формула не була науково підтверджена.
help.formula=Для кожного ввімкненого фактора відніміть передбачуваний ефект шкоди від ефекту користі, а потім помножте на важливість цього фактора. Нейтральний внесок нульовий.
help.formula_percent=Для обчислення кожне значення повзунка ділиться на 100. Оцінка опціону в 100 разів перевищує суму його факторних внесків.
help.benefit_harm=Користь означає сприятливу зміну цього фактора, шкода — несприятливу. Наприклад, для рівня стресу зниження стресу є користю, а підвищення — шкодою.
