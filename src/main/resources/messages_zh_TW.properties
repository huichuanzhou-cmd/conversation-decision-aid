help.about=這是實驗性的業餘專案，只依據你輸入的數值計算分數。它不會理解文字描述、查證假設、預測他人行為、進行心理診斷或替你做決定；公式也未經科學驗證。
help.formula=對每個已啟用因素，以估計的益處減去損害，再乘以該因素的重要性；無明顯變化的情況貢獻為零。
help.formula_percent=計算時，各滑桿的百分比先除以 100；選項分數等於各因素貢獻總和乘以 100。
help.benefit_harm=益處表示此因素朝對你有利的方向變化，損害表示朝不利方向變化。例如「壓力程度」降低屬於益處，升高屬於損害。
