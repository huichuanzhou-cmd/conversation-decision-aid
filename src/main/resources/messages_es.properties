help.about=Este proyecto de pasatiempo experimental solo calcula a partir de los valores que ingresas. No comprende descripciones escritas, no verifica suposiciones, no predice comportamientos, no proporciona un diagnóstico psicológico ni elige por usted. Su fórmula no ha sido validada científicamente.
help.formula=Para cada factor habilitado, reste el efecto perjudicial estimado del efecto beneficioso y luego multiplíquelo por la importancia de ese factor. El neutro aporta cero.
help.formula_percent=Cada valor del control deslizante se divide por 100 para el cálculo. La puntuación de una opción es 100 veces la suma de las contribuciones de sus factores.
help.benefit_harm=Beneficio significa un cambio favorable en este factor y perjuicio, uno desfavorable. Por ejemplo, en el nivel de estrés, menos estrés es un beneficio y más estrés es un perjuicio.
