tooltip.importance=这个因素对你有多重要；同一因素的重要性在所有选项中共用。
tooltip.probability=这种效应发生的可能性有多大。
tooltip.impact=如果发生，这项影响有多大；可综合考虑强度和持续时间。
tooltip.neutral=既无明显收益也无明显损害的剩余概率。
help.about=这是一个实验性的业余项目，只根据你输入的数值计算分数。它不会理解文字描述、核实假设、预测他人行为、进行心理诊断或替你做决定；公式也未经科学验证。
help.formula=对每个已启用因素，用预估收益减去预估损害，再乘以该因素的重要性；无明显变化的情况贡献为零。
help.formula_percent=计算时，各滑块的百分比先除以 100；选项分数等于各因素贡献之和乘以 100。
help.benefit_harm=收益表示这个因素朝对你有利的方向变化，损害表示朝不利方向变化。例如对于‘压力水平’，压力降低属于收益，压力升高属于损害。
