help.about=이 실험적인 취미 프로젝트는 사용자가 입력한 값으로만 ​​계산합니다. 서면 설명을 이해하지 못하고, 가정을 확인하고, 행동을 예측하고, 심리 진단을 제공하거나 귀하를 위해 선택하지 않습니다. 그 공식은 과학적으로 검증되지 않았습니다.
help.formula=활성화된 각 요인에 대해 이익 효과에서 예상 피해 효과를 뺀 다음 해당 요인의 중요도를 곱합니다. 중립은 0에 기여합니다.
help.formula_percent=각 슬라이더 값은 100으로 나누어 계산됩니다. 옵션의 점수는 해당 요소 기여도의 합계의 100배입니다.
help.benefit_harm=이점은 이 요인이 유리한 방향으로 변하는 것을, 해로움은 불리한 방향으로 변하는 것을 뜻합니다. 예를 들어 스트레스 수준에서는 스트레스 감소가 이점이고 증가가 해로움입니다.
