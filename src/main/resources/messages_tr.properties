help.about=Bu deneysel hobi projesi yalnızca girdiğiniz değerlerden hesaplama yapar. Yazılı açıklamaları anlamaz, varsayımları doğrulamaz, davranışı tahmin etmez, psikolojik teşhis koymaz veya sizin yerinize seçim yapmaz. Formülü bilimsel olarak doğrulanmamıştır.
help.formula=Etkinleştirilen her faktör için, tahmini zarar etkisini fayda etkisinden çıkarın ve ardından o faktörün önemiyle çarpın. Nötr sıfır katkıda bulunur.
help.formula_percent=Hesaplama için her kaydırıcı değeri 100'e bölünür. Bir seçeneğin puanı, faktör katkılarının toplamının 100 katıdır.
help.benefit_harm=Fayda, bu faktörde lehinize bir değişim; zarar ise aleyhinize bir değişim demektir. Örneğin stres düzeyinde stresin azalması fayda, artması zarardır.
