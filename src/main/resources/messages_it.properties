help.about=Questo progetto hobby sperimentale calcola solo in base ai valori immessi. Non comprende le descrizioni scritte, non verifica ipotesi, non prevede comportamenti, non fornisce una diagnosi psicologica o non sceglie per te. La sua formula non è stata validata scientificamente.
help.formula=Per ciascun fattore abilitato, sottrai l'effetto danno stimato dall'effetto beneficio, quindi moltiplicalo per l'importanza di quel fattore. Il neutro contribuisce a zero.
help.formula_percent=Ciascun valore del dispositivo di scorrimento viene diviso per 100 per il calcolo. Il punteggio di un'opzione è 100 volte la somma dei suoi contributi fattoriali.
help.benefit_harm=Beneficio indica un cambiamento favorevole di questo fattore; danno, uno sfavorevole. Per esempio, per il livello di stress, meno stress è un beneficio e più stress è un danno.
