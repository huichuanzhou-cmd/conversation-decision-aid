help.about=Dit experimentele hobbyproject berekent alleen op basis van de waarden die u invoert. Het begrijpt geen geschreven beschrijvingen, verifieert aannames, voorspelt geen gedrag, geeft geen psychologische diagnose of kiest niet voor u. De formule is niet wetenschappelijk gevalideerd.
help.formula=Trek voor elke ingeschakelde factor het geschatte schadelijke effect af van het voordeeleffect en vermenigvuldig dit vervolgens met het belang van die factor. Neutraal draagt ​​nul bij.
help.formula_percent=Elke schuifwaarde wordt voor berekening gedeeld door 100. De score van een optie is 100 keer de som van de factorbijdragen.
help.benefit_harm=Voordeel betekent een gunstige verandering in deze factor; nadeel een ongunstige. Bij stressniveau is minder stress bijvoorbeeld een voordeel en meer stress een nadeel.
