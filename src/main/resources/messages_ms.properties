help.about=Projek hobi percubaan ini hanya mengira daripada nilai yang anda masukkan. Ia tidak memahami huraian bertulis, mengesahkan andaian, meramalkan tingkah laku, memberikan diagnosis psikologi atau memilih untuk anda. Formulanya belum disahkan secara saintifik.
help.formula=Untuk setiap faktor yang didayakan, tolak anggaran kesan bahaya daripada kesan manfaat, kemudian darab dengan kepentingan faktor tersebut. Neutral menyumbang sifar.
help.formula_percent=Setiap nilai peluncur dibahagikan dengan 100 untuk pengiraan. Skor pilihan ialah 100 kali ganda jumlah sumbangan faktornya.
help.benefit_harm=Manfaat bermaksud perubahan yang menguntungkan bagi faktor ini; mudarat bermaksud perubahan yang tidak menguntungkan. Contohnya, bagi tahap tekanan, kurang tekanan ialah manfaat dan lebih tekanan ialah mudarat.
