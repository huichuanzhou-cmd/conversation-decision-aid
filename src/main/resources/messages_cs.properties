help.about=Tento experimentální hobby projekt počítá pouze z hodnot, které zadáte. Nerozumí písemným popisům, neověřuje domněnky, nepředvídá chování, neposkytuje psychologickou diagnózu a nevybírá za vás. Jeho vzorec nebyl vědecky ověřen.
help.formula=Pro každý aktivovaný faktor odečtěte odhadovaný škodlivý účinek od přínosu a poté vynásobte důležitostí tohoto faktoru. Neutrální přispívá nulou.
help.formula_percent=Každá hodnota posuvníku je pro výpočet vydělena 100. Skóre opce je 100násobek součtu příspěvků jejích faktorů.
help.benefit_harm=Přínos znamená příznivou změnu tohoto faktoru, újma nepříznivou. Například u míry stresu je méně stresu přínosem a více stresu újmou.
