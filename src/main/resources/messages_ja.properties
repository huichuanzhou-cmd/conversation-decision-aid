tooltip.importance=この要因をどれほど重視するか。同じ要因の重要度はすべての選択肢で共通です。
tooltip.probability=この影響が起こる可能性はどれくらいですか。
tooltip.impact=起きた場合の影響の大きさです。強さと続く期間を考慮してください。
tooltip.neutral=目立った利点も悪影響も起きない残りの確率です。
help.about=このアプリは、入力した数値から点数を計算する実験的な個人制作ソフトです。文章の意味を理解したり、仮定を検証したり、人の行動を予測したり、心理診断や判断の代行をしたりしません。計算式の科学的な有効性も確認されていません。
help.formula=有効な要因ごとに、見積もった利点から悪影響を引き、その要因に共通の重要度を掛けます。「大きな変化なし」の寄与はゼロです。
help.formula_percent=各スライダーの値は計算時に 100 で割ります。選択肢の点数は要因の寄与の合計を 100 倍した値です。
help.benefit_harm=利点はこの要因が好ましい方向に変化すること、悪影響は好ましくない方向に変化することです。例えばストレス度では、ストレスの減少が利点、増加が悪影響です。
