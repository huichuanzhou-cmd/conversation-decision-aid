help.about=Proyek hobi eksperimental ini hanya menghitung dari nilai yang Anda masukkan. Ia tidak memahami deskripsi tertulis, memverifikasi asumsi, memprediksi perilaku, memberikan diagnosis psikologis, atau memilih untuk Anda. Formulanya belum tervalidasi secara ilmiah.
help.formula=Untuk setiap faktor yang memungkinkan, kurangi perkiraan dampak kerugian dari dampak manfaat, lalu kalikan dengan tingkat kepentingan faktor tersebut. Netral memberikan kontribusi nol.
help.formula_percent=Setiap nilai slider dibagi 100 untuk perhitungan. Skor suatu opsi adalah 100 kali jumlah kontribusi faktornya.
help.benefit_harm=Manfaat berarti perubahan yang menguntungkan pada faktor ini; kerugian berarti perubahan yang merugikan. Misalnya, untuk tingkat stres, stres yang berkurang adalah manfaat dan stres yang meningkat adalah kerugian.
